spring.application.name=FileTransferApplication

# Database
# CODE REVIEW [Reliability]: No connection pool tuning (HikariCP max pool size, timeout) — defaults may be insufficient under load.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# CODE REVIEW [Security]: show-sql defaults to true — logs SQL with parameter values; set false in production.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
# CODE REVIEW [Security]: ddl-auto=update in production can cause unintended schema changes; use validate or Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}

# AWS S3
aws.region=${AWS_REGION}
aws.bucket-name=${AWS_S3_BUCKET}
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
# CODE REVIEW [Code Quality]: Missing server-side config — add spring.servlet.multipart.max-file-size,
# server.error.include-stacktrace=never, and actuator health checks for production readiness.
# CODE REVIEW [Observability]: No logging.level, management.endpoints, or spring.application monitoring config.
# CODE REVIEW [DevOps]: No profile-specific property files (application-prod.properties) — prod/dev settings mixed in one file.

scheduler.fixed-rate=${SCHEDULER_FIXED_RATE}


management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never